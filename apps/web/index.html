<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app" data-theme="auto">
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="3" y="6" width="22" height="18" rx="2" stroke="currentColor" stroke-width="2.5"/><path d="M3 12h22M14 12v12" stroke="currentColor" stroke-width="2.5"/><path d="M9 3v4M19 3v4" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>
      Handy
    </div>
    <span id="world-name" class="muted"></span>
    <span id="sync" class="muted"></span>
    <div class="grow"></div>
    <button type="button" class="btn" id="undo" title="Ctrl+Z">Deshacer</button>
    <button type="button" class="btn" id="import">Abrir mundo</button>
    <button type="button" class="btn" id="export-world">Guardar archivo</button>
    <button type="button" class="btn" id="export-cut">Despiece</button>
    <button type="button" class="btn primary" id="export-gltf">Exportar a Blender</button>
    <button type="button" class="btn" id="theme" aria-label="Cambiar tema">Tema</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </header>
  <div class="body">
    <aside id="tree" aria-label="Contenido del mundo"></aside>
    <section id="view" aria-label="Vista 3D">
      <div id="chips"><span class="chip" id="sel-chip">Nada seleccionado</span></div>
      <div id="price" tabindex="0" aria-describedby="price-pop">
        <div class="price-badge"><span id="price-total">—</span><span id="price-sub" class="muted"></span></div>
        <div id="price-pop" role="tooltip"></div>
      </div>
      <div id="issues"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <form id="cmd" autocomplete="off">
        <span id="cmd-prefix">Mundo ›</span>
        <label for="cmd-input" class="sr">Comando</label>
        <input id="cmd-input" type="text" placeholder="Haz clic en un muro o un mueble y escribe qué quieres">
        <button type="submit" class="btn primary">Aplicar</button>
      </form>
    </section>
    <aside id="props" aria-label="Propiedades"></aside>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
